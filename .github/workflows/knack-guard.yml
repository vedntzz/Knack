name: Knack guard

on:
  pull_request:

# pull-requests: write lets GITHUB_TOKEN post review comments on a block.
# Fork PRs get a read-only token; commenting then fails and the job is unchanged.
permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base commit is available to diff against.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      # Same .venv as ci.yml, from uv.lock, so the guard runs exactly as the hook does.
      - name: Install
        run: uv sync --frozen --extra dev --python 3.11
      # Every Confirmed root in data/registry/*.json whose rule still matches its pin,
      # run on the PR's changed .py files (fixtures excluded). Committed files only:
      # nothing from a developer's machine, so a local exception cannot satisfy it.
      - name: Knack guard check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .venv/bin/python scripts/ci_guard.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --registry-dir data/registry
