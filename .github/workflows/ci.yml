name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      # The Muse Code hook runs .venv/bin/python, so CI builds the same .venv.
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: ufmt check
        run: .venv/bin/ufmt check knack tests
      - name: pyright
        run: .venv/bin/pyright --pythonpath .venv/bin/python
      - name: pytest
        run: .venv/bin/pytest
