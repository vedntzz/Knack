id: compiled-rule
language: python
severity: error
message: ResumableJobMixin durable default must be typed bool | None
rule:
  any:
    - all:
        - kind: typed_default_parameter
        - regex: 'durable\s*:.*Any'
        - inside:
            stopBy: end
            kind: function_definition
            has:
              kind: identifier
              pattern: __init__
        - inside:
            stopBy: end
            any:
              - all:
                  - kind: class_definition
                  - has:
                      kind: identifier
                      pattern: ResumableJobMixin
              - all:
                  - kind: class_definition
                  - has:
                      kind: argument_list
                      regex: ResumableJobMixin
    - all:
        - kind: typed_parameter
        - regex: 'durable\s*:.*Any'
        - inside:
            stopBy: end
            kind: function_definition
            has:
              kind: identifier
              pattern: __init__
        - inside:
            stopBy: end
            any:
              - all:
                  - kind: class_definition
                  - has:
                      kind: identifier
                      pattern: ResumableJobMixin
              - all:
                  - kind: class_definition
                  - has:
                      kind: argument_list
                      regex: ResumableJobMixin
    - all:
        - kind: typed_default_parameter
        - regex: 'durable\s*:\s*bool\s*='
        - not:
            regex: '=\s*True\b'
        - inside:
            stopBy: end
            kind: function_definition
            has:
              kind: identifier
              pattern: __init__
        - inside:
            stopBy: end
            any:
              - all:
                  - kind: class_definition
                  - has:
                      kind: identifier
                      pattern: ResumableJobMixin
              - all:
                  - kind: class_definition
                  - has:
                      kind: argument_list
                      regex: ResumableJobMixin
    - all:
        - kind: typed_parameter
        - regex: 'durable\s*:\s*bool\s*$'
        - inside:
            stopBy: end
            kind: function_definition
            has:
              kind: identifier
              pattern: __init__
        - inside:
            stopBy: end
            any:
              - all:
                  - kind: class_definition
                  - has:
                      kind: identifier
                      pattern: ResumableJobMixin
              - all:
                  - kind: class_definition
                  - has:
                      kind: argument_list
                      regex: ResumableJobMixin
