id: compiled-rule
language: python
severity: error
message: Removes state/start_date DAG sort names; keep only last_run_* spelling, do not alias state/start_date onto DagRun.state/start_date.
rule:
  all:
    - pattern: SortParam($$$)
    - has:
        stopBy: end
        pattern: DagModel
    - has:
        stopBy: end
        all:
          - kind: string
          - regex: "^[\"'](state|start_date)[\"']$"