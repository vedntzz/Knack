id: airflow-75025
language: python
severity: error
message: Do not expose `state`/`start_date` as DAG sort keys; neither column exists on DagModel. Remove them instead of aliasing them onto `DagRun.state`/`DagRun.start_date`.
rule:
  any:
    - all:
        - pattern: SortParam($$$)
        - has:
            stopBy: end
            pattern: DagModel
        - has:
            stopBy: end
            kind: string
            regex: "^['\"]state['\"]$"
    - all:
        - pattern: SortParam($$$)
        - has:
            stopBy: end
            pattern: DagModel
        - has:
            stopBy: end
            kind: string
            regex: "^['\"]start_date['\"]$"