id: fastapi-15937
language: python
severity: error
message: SSE and JSONL streaming must reuse _build_response_args instead of manual handling
rule:
  all:
    - pattern: '$FUNC($$$)'
    - regex: Response
    - any:
        - has:
            stopBy: end
            regex: 'media_type.*text/event-stream'
        - has:
            stopBy: end
            regex: 'media_type.*application/jsonl'
    - not:
        has:
          stopBy: end
          regex: '[*][*]'
