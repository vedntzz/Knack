<style>

:root {

  --washi: #eae6dc;

* { box-sizing: border-box; margin: 0; padding: 0; }

<script>
const B = window.BLOCK, $ = (id) => document.getElementById(id);
const truth = { checked: 0, missing: [] };
window.__truth = truth;
const short = (hash) => hash.slice(0, 12);
const tail = (path) => path.split("/").slice(-2).join("/");
const prNumber = () => bound(B.root.source_url.split("/").pop());
const day = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }).replace(",", "");
const SVG = "http://www.w3.org/2000/svg";

// Every shown value is checked against the fixture text it came from.
function bound(text) {
  truth.checked++;
  if (!JSON.stringify(B).includes(JSON.stringify(text).slice(1, -1))) { truth.missing.push(text); console.error("truth: not in fixture", text); }
  return text;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function codeSpans(parent, text) {
  text.split(/(`[^`]+`)/).forEach((part) => parent.append(part.startsWith("`") ? el("code", null, part.slice(1, -1)) : part));
  return parent;
}
function marked(parent, code, tokens) {
  const hit = tokens.find((t) => code.includes(t));
  if (!hit) return parent.append(code), parent;
  const at = code.indexOf(hit);
  parent.append(code.slice(0, at), el("span", "tok", hit));
  return marked(parent, code.slice(at + hit.length), tokens);
}
function row(r, cols, tokens, note, indent = 0) {
  const e = el("div", `row ${r.kind}${note != null ? " hit" : ""}`);
  cols.forEach((n) => e.append(el("span", "n", n == null ? "" : n)));
  e.append(el("span", "sign", { add: "+", del: "−", ctx: " " }[r.kind]), marked(el("span", "c"), bound(r.code).slice(indent), tokens));
  if (note != null) e.append(el("span", "why", note));
  return e;
}
function icon(d, w) {
  const s = document.createElementNS(SVG, "svg"), p = document.createElementNS(SVG, "path");
  [["width", w], ["height", 12], ["viewBox", `0 0 ${w} 12`], ["aria-hidden", "true"]].forEach(([k, v]) => s.setAttribute(k, v));
  [["d", d], ["stroke", "var(--grey)"], ["stroke-width", "1.5"], ["fill", "none"], ["stroke-linecap", "round"], ["stroke-linejoin", "round"]].forEach(([k, v]) => p.setAttribute(k, v));
  s.append(p);
  return s;
}

const removed = () => B.attempted.matched.filter((m) => !m.text.includes(":")).map((m) => bound(m.text).replaceAll('"', ""));
const kept = () => B.attempted.rows.filter((r) => r.kind === "add" && r.code.includes("last_run_"));
const keptNames = () => kept().map((r) => bound(r.code).match(/"([^"]+)"/)[1]);

function buildBar() {
  $("c-repo").textContent = bound(B.where.repo);
  $("c-branch").textContent = bound(B.where.branch);
  $("c-file").textContent = tail(bound(B.where.file));
  $("c-tool").textContent = `${bound(B.where.tool)}, stopped before it ran`;
}
function buildTitle() {
  const lines = B.where.lines, h1 = $("t-h1"), [a, b] = removed();
  $("t-sub").textContent = `${tail(bound(B.where.file))}, lines ${bound(String(lines[0]))}–${bound(String(lines.at(-1)))}`;
  h1.append(codeSpans(el("span"), `This edit aliases \`${a}\` and \`${b}\` onto \`DagRun\`.`));
  h1.append(el("span", null, `#${prNumber()} chose removal over aliasing. Merged by ${bound(B.person.approved_by)}.`));
}
function lead() {
  const [a, b] = keptNames(), keep = kept().map((r) => bound(String(r.new)));
  return codeSpans(el("p", "lead"), `Removed on purpose in #${prNumber()} — sort by \`${a}\` / \`${b}\` instead, already on lines ${keep[0]}–${keep.at(-1)}.`);
}
function evidence() {
  const box = el("div", "evidence"), gone = removed(), now = keptNames();
  gone.forEach((t) => box.append(el("s", "chip gone", t)));
  box.append(icon("M1 6h20M16 1l5 5-5 5", 24), el("span", "sr", "replaced by"));
  now.forEach((t) => box.append(el("span", "chip", t)));
  return box;
}
function who() {
  const box = el("div", "who"), p = B.person, img = el("img");
  img.src = bound(p.avatar); img.alt = ""; img.onerror = () => img.remove();
  const pr = el("a", null, `#${prNumber()}`); pr.href = bound(B.root.source_url);
  const meta = el("span", null, `merged by ${bound(p.approved_by)} · `), when = el("time", "date"); when.append(el("span", null, day(bound(B.root.merged_at))));
  meta.append(when, " · ", pr);
  box.append(img, el("b", null, bound(p.name)), meta);
  return box;
}
function said() {
  const [first, second] = B.quote.sentences.map(bound), third = bound(B.quote.not_recorded), phrase = bound(B.quote.rejected_phrase), at = first.indexOf(phrase);
  const q = el("blockquote", "said"); q.cite = B.root.source_url;
  codeSpans(q, "“" + first.slice(0, at)); q.append(codeSpans(el("span", "no"), phrase));
  codeSpans(q, `${first.slice(at + phrase.length)} ${second} ${third}”`);
  return q;
}
function offered() {
  const p = el("p", "offered");
  p.append(el("b", null, "Aliasing was offered;"), " the merged change didn't take it.");
  return p;
}
function change() {
  const d = el("details"), s = el("summary"), box = el("div", "change"), tokens = B.attempted.matched.filter((m) => !m.text.includes(":")).map((m) => m.text);
  s.append(icon("M4 2l4 4-4 4", 12), `Show the change in #${prNumber()}`);
  changeRows().forEach(([where, rows]) => { box.append(el("div", "where", where)); rows.forEach((r) => box.append(row({ ...r, code: r.code.trimStart() }, [], r.kind === "del" ? tokens : [], null))); });
  d.append(s, box);
  return d;
}
// #75025 made the same one-line change in both files; show it once when the code is identical.
function changeRows() {
  const [f, g] = B.rejected, same = g && f.rows.every((r, i) => r.code === g.rows[i]?.code);
  const at = (x) => `${tail(bound(x.file))} line ${bound(String(x.rows[0].line))}`;
  if (same) return [[`${B.rejected.map(at).join(" and ")}, the same line in both`, f.rows]];
  return B.rejected.map((x) => [at(x), x.rows]);
}
function buildThread() {
  const t = el("div", "thread");
  t.append(lead(), evidence(), who(), said(), offered(), change());
  return t;
}
function counts(rows) { return `${rows.filter((r) => r.kind === "del").length} line removed, ${rows.filter((r) => r.kind === "add").length} added`; }
function buildDiff() {
  const a = B.attempted, hits = new Set(a.matched.map((m) => m.line)), last = Math.max(...hits);
  const tokens = a.matched.filter((m) => m.text.includes(":")).map((m) => m.text);
  $("d-path").append(bound(a.file).replace(/[^/]+$/, ""), el("b", null, a.file.split("/").pop()));
  $("d-count").textContent = `${bound(B.where.tool)}: ${counts(a.rows)}`;
  const shown = a.rows.filter((r) => r.kind !== "ctx" && (r.new == null || r.new <= last + 2)), indent = Math.min(...shown.map((r) => r.code.match(/^ */)[0].length));
  shown.forEach((r) => {
    const nums = [r.old, r.new].map((n) => (n == null ? null : bound(String(n))));
    $("d-rows").append(row(r, nums, hits.has(r.new) ? tokens : [], hits.has(r.new) ? "" : null, indent));
    if (r.new === last) $("d-rows").append(buildThread());
  });
}
function buildFix() {
  const hits = B.where.lines, keep = kept().map((r) => r.new);
  $("f-do").textContent = `Delete lines ${bound(String(hits[0]))}–${bound(String(hits.at(-1)))}.`;
  $("f-ok").textContent = `Lines ${bound(String(keep[0]))}–${bound(String(keep.at(-1)))} already use the right names.`;
  $("f-argue").append(el("code", null, bound(B.where.dispute)));
}
function figure(big, unit, label, why) {
  const f = el("div"), b = el("b", null, big);
  f.title = why;
  if (unit) b.append(" ", el("small", null, unit));
  f.append(b, el("span", null, label));
  return f;
}
function buildRail() {
  const [a, b] = keptNames(), [x, y] = removed(), g = B.proof.grid, passed = g.gates.filter((k) => bound(g.cells[k]) === "PASS");
  $("r-decision").textContent = `Sort by ${a} and ${b}. Bare ${x} and ${y} were removed on purpose.`;
  const model = bound(B.proof.no_model).startsWith("No model") ? "no AI model in the block" : "";
  const checks = `replay checks: ${passed.map(bound).join(", ")}`, fp = `on Airflow's current tree and release ${bound(B.proof.old_release)}`, ms = `round trip; ${bound(B.proof.verdict_ms)} ms verdict by ${bound(B.proof.scan)}`;
  $("r-figures").append(figure(`${passed.length}/${g.gates.length}`, "", "checks passed", checks), figure(bound(String(B.proof.fp)), "", "false alarms on Airflow", fp), figure(bound(B.proof.round_trip_ms), "ms", model, ms));
}
function stamp(iso) { return iso.replace("T", " ").replace(/([+-])(\d\d:\d\d)$/, (m, s, z) => ` ${s === "-" ? "−" : "+"}${z}`); }
function buildVerify() {
  const w = B.where, r = B.root, p = B.proof, held = p.grid.gates.find((k) => k === "held-out");
  [`rule ${bound(w.rule)}`, `root ${bound(r.id)}, ${bound(r.status)}, ${r.seeded ? "seeded" : "not seeded"}`, `${bound(w.hook)} ${bound(w.decision)}`,
   `${bound(held)} gate ${bound(p.grid.cells[held])}`, `receipt ${bound(short(p.receipt))}`, `log committed ${stamp(bound(w.log_committed))}`]
    .forEach((t) => $("verify").append(el("span", null, t)));
  $("verify").lastChild.title = "commit time of bench/demo_block.log; the block's own time was not kept";
}

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "a" || e.key === "A") { e.preventDefault(); $("argue").focus(); $("argue").click(); }
  if (e.key === "Escape") { $("dismiss").focus(); $("dismiss").click(); }
}
function argue() { $("argue").classList.add("pressed"); setTimeout(() => $("argue").classList.remove("pressed"), 140); }
function dismiss() { $("f-dismiss").textContent = "dismissed; the edit is already stopped"; }

buildBar(); buildTitle(); buildDiff(); buildFix(); buildRail(); buildVerify();
if (new URLSearchParams(location.search).has("open")) document.querySelector("details").open = true;

// Arrival, about 2 s inside a 5 s clip: the edit, then the gold link, then the words, then the fix.
const EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)", FILM = new URLSearchParams(location.search).has("film");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function play(node, frames, delay, duration, easing) {
  const a = node.animate(frames, { delay, duration, easing, fill: "backwards" });
  if (FILM) a.pause();
  return a;
}
function arrive(nodes, start, step = 30) {
  nodes.forEach((n, i) => play(n, [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], start + i * step, 220, EASE_OUT));
  return start + (nodes.length - 1) * step + 220;
}
const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function link(start) {
  const gold = token("--kuchiba");
  document.querySelectorAll(".row.hit").forEach((n) => play(n, [{ borderLeftColor: token("--raised") }, { borderLeftColor: gold }], start, 240, "ease"));
  play(document.querySelector(".thread"), [{ borderLeftColor: token("--sumi") }, { borderLeftColor: gold }], start, 240, "ease");
  document.querySelectorAll(".tok").forEach((n) => play(n, [{ color: token("--washi") }, { color: gold }], start, 240, "ease"));

  return start + 360;
}
function motion() {
  const code = arrive([...document.querySelectorAll("#d-rows > .row")], 300);
  const words = arrive([...document.querySelectorAll(".thread > *")], code + 80, 60);
  const linked = link(words + 80);
  arrive([...document.querySelectorAll(".rail > section")], linked + 40, 80);
}
if (!REDUCED) motion();
window.__film = (ms) => document.getAnimations().forEach((a) => { a.currentTime = ms; });
document.addEventListener("keydown", onKey);
$("argue").addEventListener("click", argue);
$("dismiss").addEventListener("click", dismiss);
// At 1280×720 and its multiples the frame fills the screen; smaller screens keep a 16 px margin.
function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720), m = s < 1 ? 16 : 0, k = s < 1 ? Math.min((innerWidth - 2 * m) / 1280, (innerHeight - 2 * m) / 720) : s;
  $("screen").style.transform = k === 1 ? "" : `translate(${m}px, ${m}px) scale(${k})`;
}
addEventListener("resize", fit); fit();
document.fonts.ready.then(() => { window.__ready = true; });
</script>
